[project]
name = "telco-rag-paper-offline"
version = "0.1.0"
description = "Offline Telco-RAG paper reproduction on the filtered TeleQnA set"
requires-python = ">=3.11,<3.13"
dependencies = [
  "doc2docx>=0.2",
  "dynaconf>=3.2",
  "faiss-cpu>=1.8",
  "huggingface-hub>=1.0",
  "numpy>=1.26,<3",
  "openai>=1.0,<2",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "toml>=0.10",
  "torch>=2.2",
  "tqdm>=4.66",
  "ujson>=5.10",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
